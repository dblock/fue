name: Test
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ${{ matrix.entry.os }}
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '3.0', os: ubuntu-latest }
          - { ruby: '4.0', os: ubuntu-latest }
          - { ruby: '4.0', os: macos-latest }
    name: Test (Ruby ${{ matrix.entry.ruby }}, ${{ matrix.entry.os }})
    env:
      BUNDLE_WITHOUT: 'lint:danger'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.entry.ruby }}
          bundler-cache: true
      - name: Run Tests
        run: bundle exec rake spec
