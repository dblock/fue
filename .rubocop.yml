plugins:
  - rubocop-performance
  - rubocop-prose
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'pkg/**/*'
    - 'spec/support/fixtures/**/*'
    - 'LICENSE.md'

Style/Documentation:
  Enabled: false

Metrics:
  Enabled: false

Layout/EndOfLine:
  EnforcedStyle: lf

# The GLI pre hook shares the finder with command actions.
Style/GlobalVars:
  AllowedVariables:
    - $fue

# GraphQL responses are deeply nested optional objects.
Style/SafeNavigationChainLength:
  Enabled: false

# Specs set expectations on collaborators (shell, keychain, GraphQL) with mocks.
RSpec/MessageSpies:
  Enabled: false

RSpec/StubbedMock:
  Enabled: false

RSpec/SubjectStub:
  Enabled: false

RSpec/ExpectInHook:
  Enabled: false

# Recorded VCR examples keep related assertions together.
RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/NamedSubject:
  Enabled: false
